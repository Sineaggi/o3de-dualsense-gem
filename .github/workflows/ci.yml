#
# CI for the DualSense gem. An O3DE gem cannot build standalone, so each build
# job first obtains an engine, by the two routes users actually take:
#
#   linux-sdk      — installed-engine route. Development-branch .deb from
#                    o3debinaries.org's dated snapshot directory (engine 2.7.0,
#                    matching gem.json's compatible_engines), gem built through a
#                    throwaway MinimalProject host. Also exercises
#                    FindSDL3.cmake's stock FetchContent fallback, which only
#                    runs on installed engines.
#   windows-sdk    — installed-engine route on Windows: silent-install of the
#                    dated snapshot's o3de_2.7.0.msi (the bare MSI is not
#                    advertised anywhere — its URL comes from the payload
#                    manifest inside the "Latest" Burn bootstrapper), same
#                    MinimalProject host flow as linux-sdk. Covers the stock
#                    FetchContent fallback under MSVC.
#   windows-source — source-engine route. o3de/o3de checked out at the pinned
#                    O3DE_REF below and the gem grafted on via
#                    O3DE_EXTERNAL_SUBDIRS, mirroring the README's local recipe.
#                    MSVC /W4 /WX; target-scoped to the runtime module, whose
#                    dependency closure stops at AzCore/AzFramework (building
#                    DualSense.Editor here would drag in AzToolsFramework + Qt).
#                    Kept alongside the SDK jobs because dev HEAD moves: this is
#                    the job that catches upstream engine-API drift early.
#
# There is no macOS job: no prebuilt engine exists for Mac, and macOS is the one
# platform with routine local build/test coverage. DualSense.Tests only exists
# where PAL_TRAIT_DUALSENSE_TEST_SUPPORTED is TRUE (Mac only today), so both CI
# jobs are compile/link checks.
#
# Third-party actions are pinned by commit SHA (o3de repo convention).
#
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".superpowers/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".superpowers/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned o3de development-branch commit for the Windows source build; bump
  # deliberately. Must stay >= the version bound in gem.json compatible_engines.
  O3DE_REF: 4667f3fc3e4f819cb5ad6a0dce4d1221a6545e5d
  # Dated o3debinaries.org snapshot both SDK jobs install (engine 2.7.0).
  # "development/Latest" is a moving pointer (and was two months stale when
  # checked); the dated directory is pinned and reproducible. Discovered from
  # the DownloadUrl entries in the Latest Burn bootstrapper's manifest. Bump
  # together with O3DE_REF when moving to a newer engine snapshot.
  O3DE_SDK_BUILD: 2026-05-30-6a0c36d86
  O3DE_SDK_VERSION: 2.7.0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout gem
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: false

      - name: Validate gem.json and license files
        run: |
          test -f LICENSE_APACHE2.TXT
          test -f LICENSE_MIT.TXT
          python3 - <<'EOF'
          import json
          raw = open("gem.json").read()
          # O3DE's CMake JSON reader (O3DEJson.cmake) expands file content
          # unquoted, so CMake list-splits it at semicolons and the parse fails
          # mid-file. A ';' anywhere in gem.json breaks every engine configure.
          assert ";" not in raw, "gem.json must not contain ';' (CMake list-split breaks O3DE's JSON reader)"
          g = json.loads(raw)
          assert g["gem_name"] == "DualSense", g["gem_name"]
          for field in ("version", "license", "origin_url", "documentation_url", "repo_uri"):
              assert g.get(field), f"gem.json field {field!r} is empty"
          engines = g["compatible_engines"]
          assert any(e.startswith("o3de>") or e.startswith("o3de=") for e in engines), engines
          assert any(e.startswith("o3de-sdk") for e in engines), \
              "installed-SDK engines are named o3de-sdk; without an o3de-sdk entry every Project Manager user is blocked"
          print("gem.json OK:", g["gem_name"], g["version"], engines)
          EOF

  linux-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout gem
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: false

      - name: Cache 3rdParty packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.o3de/3rdParty
          key: linux-sdk-3p-${{ env.O3DE_SDK_BUILD }}
          restore-keys: |
            linux-sdk-3p-

      - name: Download and install engine (pinned development snapshot)
        run: |
          base="https://o3debinaries.org/development/${O3DE_SDK_BUILD}/Linux"
          curl -fL -o o3de.deb.sha256 "$base/o3de_${O3DE_SDK_VERSION}.deb.sha256"
          curl -fL -o o3de.deb "$base/o3de_${O3DE_SDK_VERSION}.deb"
          echo "$(cut -d' ' -f1 o3de.deb.sha256)  o3de.deb" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y ./o3de.deb ninja-build libudev-dev clang-17
          rm o3de.deb

      - name: Register engine
        run: |
          ENGINE_DIR=$(ls -d /opt/O3DE/*/ | head -1)
          ENGINE_DIR=${ENGINE_DIR%/}
          echo "ENGINE_DIR=$ENGINE_DIR" >> "$GITHUB_ENV"
          "$ENGINE_DIR/python/get_python.sh"
          "$ENGINE_DIR/scripts/o3de.sh" register --this-engine --force

      - name: Create host project and enable gem
        run: |
          "$ENGINE_DIR/scripts/o3de.sh" create-project --project-path "$RUNNER_TEMP/CIHost" --template-name MinimalProject
          "$ENGINE_DIR/scripts/o3de.sh" register --gem-path "$GITHUB_WORKSPACE"
          "$ENGINE_DIR/scripts/o3de.sh" enable-gem --gem-name DualSense --project-path "$RUNNER_TEMP/CIHost"

      - name: Configure
        # Retried because 3rdParty package downloads (cloudfront) intermittently
        # fail with SSL connect errors; already-downloaded packages are reused,
        # so a retry converges instead of starting over.
        #
        # -fclang-abi-compat=17: the SDK's prebuilt libs export auto-NTTP
        # template symbols (e.g. GetO3deTypeId for CVarFixedString's
        # fixed_string<char, 256>) with the pre-LLVM-18 mangling (IcLm256E).
        # The runner's clang-18 defaults to the newer Itanium template-param-decl
        # mangling (IcTnDaLm256E), so the gem's references don't resolve against
        # libAzCore.so at link time. Verified by extracting the nightly deb and
        # grepping both manglings in its libAzCore.so exports.
        #
        # clang-17's *default* mangling matches the SDK (verified with llvm@17
        # locally). Passed as explicit cache variables because both indirect
        # mechanisms failed on real runs: -DCMAKE_CXX_FLAGS didn't survive into
        # the gem's compile lines (round 6), and env CC/CXX was visibly set yet
        # CMake still identified Clang 18.1.3 (round 7) — the engine/template
        # bootstrap swallows both. Explicit CMAKE_<LANG>_COMPILER precedes every
        # other selection mechanism, including the SDK's own compiler search.
        run: |
          attempt=0
          until cmake -S "$RUNNER_TEMP/CIHost" -B "$RUNNER_TEMP/CIHost/build" -G "Ninja Multi-Config" \
              -DCMAKE_C_COMPILER=/usr/bin/clang-17 \
              -DCMAKE_CXX_COMPILER=/usr/bin/clang++-17 \
              -DCMAKE_CXX_FLAGS="-fclang-abi-compat=17"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "Configure failed after $attempt attempts"
              exit 1
            fi
            echo "Configure failed (attempt $attempt); retrying in 20s (transient package-CDN errors)"
            sleep 20
          done
          echo "--- compiler actually configured:"
          grep -E "CMAKE_(C|CXX)_COMPILER:" "$RUNNER_TEMP/CIHost/build/CMakeCache.txt"

      - name: Build gem (runtime + editor modules)
        run: cmake --build "$RUNNER_TEMP/CIHost/build" --config profile --target DualSense DualSense.Editor

  windows-sdk:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout gem
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          show-progress: false

      - name: Cache 3rdParty packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.o3de/3rdParty
          key: windows-sdk-3p-${{ env.O3DE_SDK_BUILD }}
          restore-keys: |
            windows-sdk-3p-

      - name: Download and install engine (pinned development snapshot)
        # The bare MSI + cabs are not linked from any download page; the URLs
        # come from the Burn bootstrapper's payload manifest. 28 cabs is fixed
        # for this pinned snapshot. INSTALL_ROOT must be a space-free path
        # (LYPython.cmake breaks under "C:\Program Files"), and a /qn install
        # does not self-register — the register step below handles that.
        run: |
          $base = "https://www.o3debinaries.org/development/${{ env.O3DE_SDK_BUILD }}/Windows"
          $dl = "$env:RUNNER_TEMP\o3de-msi"
          New-Item -ItemType Directory -Force $dl | Out-Null
          curl.exe -fsSL -o "$dl\o3de.msi" "$base/o3de_${{ env.O3DE_SDK_VERSION }}.msi"
          foreach ($i in 1..28) {
            curl.exe -fsSL -o "$dl\cab$i.cab" "$base/cab$i.cab"
          }
          $p = Start-Process msiexec.exe -ArgumentList "/i","$dl\o3de.msi","INSTALL_ROOT=C:\O3DE","/qn","/norestart" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          Remove-Item -Recurse -Force $dl

      - name: Locate and register engine
        run: |
          $engineJson = Get-ChildItem -Path C:\O3DE -Filter engine.json -Recurse -Depth 3 | Select-Object -First 1
          if (-not $engineJson) { throw "engine.json not found under C:\O3DE after install" }
          $engineDir = $engineJson.DirectoryName
          Write-Host "Engine at $engineDir"
          "O3DE_ENGINE_DIR=$engineDir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          & "$engineDir\python\get_python.bat"
          if ($LASTEXITCODE -ne 0) { throw "get_python failed" }
          & "$engineDir\scripts\o3de.bat" register --this-engine
          if ($LASTEXITCODE -ne 0) { throw "engine register failed" }

      - name: Create host project and enable gem
        run: |
          & "$env:O3DE_ENGINE_DIR\scripts\o3de.bat" create-project --project-path "$env:RUNNER_TEMP\CIHost" --template-name MinimalProject
          if ($LASTEXITCODE -ne 0) { throw "create-project failed" }
          & "$env:O3DE_ENGINE_DIR\scripts\o3de.bat" register --gem-path "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "gem register failed" }
          & "$env:O3DE_ENGINE_DIR\scripts\o3de.bat" enable-gem --gem-name DualSense --project-path "$env:RUNNER_TEMP\CIHost"
          if ($LASTEXITCODE -ne 0) { throw "enable-gem failed" }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        with:
          arch: x64

      - name: Configure
        # Same transient-CDN retry rationale as linux-sdk.
        run: |
          $attempt = 0
          while ($true) {
            cmake -S "$env:RUNNER_TEMP\CIHost" -B "$env:RUNNER_TEMP\CIHost\build" -G "Ninja Multi-Config"
            if ($LASTEXITCODE -eq 0) { break }
            $attempt++
            if ($attempt -ge 3) {
              Write-Host "Configure failed after $attempt attempts"
              exit 1
            }
            Write-Host "Configure failed (attempt $attempt); retrying in 20s (transient package-CDN errors)"
            Start-Sleep 20
          }

      - name: Build gem (runtime + editor modules)
        run: cmake --build "$env:RUNNER_TEMP\CIHost\build" --config profile --target DualSense DualSense.Editor

  windows-source:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout gem
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: gem
          show-progress: false

      - name: Checkout o3de at pinned ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: o3de/o3de
          ref: ${{ env.O3DE_REF }}
          path: o3de
          show-progress: false

      - name: Cache 3rdParty packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: 3rdParty/downloaded_packages
          key: windows-src-3p-${{ env.O3DE_REF }}
          restore-keys: |
            windows-src-3p-

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ccache
          key: windows-src-ccache-${{ env.O3DE_REF }}-${{ github.sha }}
          restore-keys: |
            windows-src-ccache-${{ env.O3DE_REF }}-
            windows-src-ccache-

      - name: Setup ccache
        uses: chocobo1/setup-ccache-action@37c3347f8a7738e82aab7a06f276f7a12e3008fb # v1.5.3
        with:
          windows_compile_environment: msvc
          prepend_symlinks_to_path: false
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ github.workspace }}\.ccache
            hash_dir=false
            inode_cache=true
            max_size=5G

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
        with:
          arch: x64

      - name: Get engine python
        run: .\o3de\python\get_python.bat

      - name: Register engine and gem
        # O3DE_EXTERNAL_SUBDIRS makes the gem's targets part of the build, but
        # o3de_add_variant_dependencies_for_gem_dependencies resolves gem paths
        # through the ~/.o3de manifest (@GEMROOT@), so the gem must also be
        # registered — same dual setup as local development.
        run: |
          .\o3de\scripts\o3de.bat register --this-engine
          .\o3de\scripts\o3de.bat register --gem-path .\gem

      - name: Configure
        shell: pwsh
        run: |
          $ws = '${{ github.workspace }}'.Replace('\', '/')
          cmake -S o3de -B build -G "Ninja Multi-Config" `
            -DLY_DISABLE_TEST_MODULES=FALSE `
            -DLY_PARALLEL_LINK_JOBS=2 `
            "-DLY_3RDPARTY_PATH=$ws/3rdParty" `
            "-DO3DE_EXTERNAL_SUBDIRS=$ws/gem"

      - name: Build gem runtime module
        run: cmake --build build --config profile --target DualSense

      - name: ccache stats
        if: always()
        run: ccache -s
